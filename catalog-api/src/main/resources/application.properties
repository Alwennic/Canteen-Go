server.port=5000
spring.main.banner-mode=off

# Database settings come from environment variables set in docker-compose.yml
spring.datasource.url=jdbc:mysql://${DB_HOST:db}:3306/${DB_NAME:canteengo}
spring.datasource.username=${DB_USER:canteen}
spring.datasource.password=${DB_PASSWORD:}

# Same secret as auth-api, used to check the login token
canteengo.jwt.secret=${JWT_SECRET:dev-secret}
